<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sbNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2744"/>
    </linearGradient>
  </defs>
  <!-- Background Shield/Square with Rounded Corners -->
  <rect width="64" height="64" rx="14" fill="url(#sbNavyGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Classical Bank Pediment / Roof -->
  <polygon points="32,10 11,23 53,23" fill="#ffffff"/>
  <!-- Gold Accent on Pediment Tympanum -->
  <polygon points="32,13 16,22 48,22" fill="#f59e0b"/>

  <!-- Entablature / Architrave Beam -->
  <rect x="11" y="23" width="42" height="4" rx="1" fill="#ffffff"/>

  <!-- 4 Classical Columns / Pillars -->
  <!-- Pillar 1 -->
  <rect x="15" y="28" width="5.5" height="18" rx="1" fill="#ffffff"/>
  <!-- Pillar 2 -->
  <rect x="24.5" y="28" width="5.5" height="18" rx="1" fill="#ffffff"/>
  <!-- Pillar 3 -->
  <rect x="34" y="28" width="5.5" height="18" rx="1" fill="#ffffff"/>
  <!-- Pillar 4 -->
  <rect x="43.5" y="28" width="5.5" height="18" rx="1" fill="#ffffff"/>

  <!-- Stylobate / Multi-tiered Foundation Base -->
  <rect x="12" y="47" width="40" height="3" rx="0.5" fill="#ffffff"/>
  <rect x="9" y="51" width="46" height="4" rx="1" fill="#ffffff"/>
  <!-- Subtle Gold Foundation Accent -->
  <rect x="11" y="53" width="42" height="1.5" rx="0.5" fill="#f59e0b"/>
</svg>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBank — User Account Management</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="alternate icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar('admin-users')}"></div>

<div class="container py-4">
    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-person-lines-fill me-2 text-primary"></i> System Users & RBAC Roles</h5>
            <span class="badge bg-secondary" th:text="${users.size()} + ' users'">0 users</span>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Assigned Role</th>
                        <th>Account Status</th>
                        <th>Failed Attempts</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.id}">1</td>
                        <td class="fw-bold" th:text="${u.username}">username</td>
                        <td th:text="${u.fullName}">Name</td>
                        <td class="small text-muted" th:text="${u.email}">email</td>
                        <td><span class="badge bg-primary" th:text="${u.role}">ROLE</span></td>
                        <td>
                            <span class="badge" th:classappend="${u.accountNonLocked ? 'bg-success' : 'bg-danger'}"
                                  th:text="${u.accountNonLocked ? 'ACTIVE' : 'LOCKED'}">STATUS</span>
                        </td>
                        <td th:text="${u.failedLoginAttempts != null ? u.failedLoginAttempts : 0}">0</td>
                        <td>
                            <form th:action="@{/admin/users/{id}/toggle-lock(id=${u.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${u.accountNonLocked ? 'btn-outline-danger' : 'btn-outline-success'}">
                                    <span th:text="${u.accountNonLocked ? 'Lock User' : 'Unlock User'}">Toggle</span>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

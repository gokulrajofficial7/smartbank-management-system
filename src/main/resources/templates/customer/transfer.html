<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBank — Fund Transfer</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="alternate icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar('transactions')}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-arrow-left-right text-primary me-2"></i> Transfer Funds</h5>
                </div>
                <div class="card-body p-4">
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${errorMessage}">Error</span>
                    </div>

                    <form th:action="@{/customer/transfer}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <!-- Sender Account (Only Customer's OWN Accounts!) -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">From Account *</label>
                            <select name="senderAccountNumber" class="form-select font-monospace" required>
                                <option th:each="acc : ${accounts}"
                                        th:value="${acc.accountNumber}"
                                        th:selected="${acc.accountNumber == senderAccountNumber or (senderAccountNumber == null and customer != null and acc.accountNumber == customer.accountNumber)}"
                                        th:text="${acc.accountNumber + ' (' + acc.accountType + ') — Balance: ' + @currencyUtil.format(acc.balance)}">
                                    SB1000000001 (SAVINGS) — Balance: ₹10,000.00
                                </option>
                                <option th:if="${#lists.isEmpty(accounts) and customer != null}"
                                        th:value="${customer.accountNumber}"
                                        th:text="${customer.accountNumber + ' — Balance: ' + @currencyUtil.format(customer.balance)}">
                                    SB1000000001
                                </option>
                            </select>
                            <div class="form-text text-success"><i class="bi bi-shield-check"></i> Server-side ownership validated. You can select any eligible account you own.</div>
                        </div>

                        <!-- Beneficiary Quick-Select -->
                        <div class="mb-3" th:if="${not #lists.isEmpty(beneficiaries)}">
                            <label class="form-label fw-semibold">Quick Select Saved Beneficiary</label>
                            <select class="form-select" onchange="document.getElementById('receiverAcc').value = this.value">
                                <option value="">-- Choose Beneficiary (or enter manually below) --</option>
                                <option th:each="b : ${beneficiaries}"
                                        th:value="${b.targetAccountNumber}"
                                        th:text="${b.targetAccountName + ' (' + b.targetAccountNumber + ') - ' + b.bankName}">
                                    Beneficiary
                                </option>
                            </select>
                        </div>

                        <!-- Target Account Number -->
                        <div class="mb-3">
                            <label for="receiverAcc" class="form-label fw-semibold">To Account Number *</label>
                            <input type="text" class="form-control font-monospace" id="receiverAcc" name="receiverAccountNumber"
                                   th:value="${receiverAccountNumber}" placeholder="e.g. SB7505485085" required>
                        </div>

                        <!-- Payment Channel -->
                        <div class="mb-3">
                            <label for="channel" class="form-label fw-semibold">Payment Channel / Settlement Mode</label>
                            <select class="form-select" id="channel" name="channel">
                                <option value="INTERNAL" th:selected="${selectedChannel == null or selectedChannel.name() == 'INTERNAL'}">Internal Transfer (SmartBank to SmartBank)</option>
                                <option value="UPI" th:selected="${selectedChannel != null and selectedChannel.name() == 'UPI'}">UPI — Unified Payments Interface (Max ₹1,00,000 / simulated)</option>
                                <option value="IMPS" th:selected="${selectedChannel != null and selectedChannel.name() == 'IMPS'}">IMPS — Immediate Payment Service 24x7 (Max ₹5,00,000 / simulated)</option>
                                <option value="NEFT" th:selected="${selectedChannel != null and selectedChannel.name() == 'NEFT'}">NEFT — National Electronic Funds Transfer (Max ₹10,00,000 / simulated)</option>
                                <option value="RTGS" th:selected="${selectedChannel != null and selectedChannel.name() == 'RTGS'}">RTGS — Real Time Gross Settlement (Mandatory Min ₹2,00,000 / simulated)</option>
                            </select>
                            <div class="form-text text-muted small">
                                <i class="bi bi-shield-check text-primary me-1"></i>Regulated under RBI and NPCI clearing guidelines (Simulated environment).
                            </div>
                        </div>

                        <!-- Amount -->
                        <div class="mb-3">
                            <label for="amount" class="form-label fw-semibold">Amount (₹) *</label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" step="0.01" min="1.00" class="form-control" id="amount" name="amount"
                                       th:value="${amount}" placeholder="0.00" required>
                            </div>
                            <div class="form-text small text-muted">
                                Single limit: ₹25,000.00. Amounts &ge; ₹10,000.00 require Dual-Control Maker-Checker Manager approval.
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="mb-4">
                            <label for="desc" class="form-label fw-semibold">Remarks / Memo</label>
                            <input type="text" class="form-control" id="desc" name="description" placeholder="e.g. Invoice payment, rent">
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/customer/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="bi bi-send-fill me-1"></i> Confirm & Transfer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form[action*="/customer/transfer"]');
        if (form) {
            let isSubmitting = false;
            form.addEventListener('submit', function(e) {
                if (isSubmitting) {
                    e.preventDefault();
                    return false;
                }
                isSubmitting = true;
                const btn = form.querySelector('button[type="submit"]');
                if (btn) {
                    btn.classList.add('disabled');
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Processing...';
                    setTimeout(function() { btn.disabled = true; }, 20);
                }
            });
        }
    });
</script>
</body>
</html>

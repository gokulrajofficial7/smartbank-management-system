<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBank — Open Account</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="alternate icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }
        .register-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-width: 650px;
            width: 100%;
            padding: 40px;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-1">Open an Account</h3>
            <p class="text-muted small mb-0">Join SmartBank with instant online account opening</p>
        </div>
        <a th:href="@{/login}" class="btn btn-outline-secondary btn-sm">Sign In Instead</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}">Error</span>
    </div>

    <form th:action="@{/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="row g-3">
            <div class="col-md-6">
                <label for="fullName" class="form-label fw-semibold small">Full Legal Name *</label>
                <input type="text" class="form-control" id="fullName" name="fullName" th:value="${fullName}" placeholder="e.g. John Doe" required>
            </div>

            <div class="col-md-6">
                <label for="username" class="form-label fw-semibold small">Desired Username *</label>
                <input type="text" class="form-control" id="username" name="username" th:value="${username}" placeholder="e.g. johndoe" required>
            </div>

            <div class="col-md-6">
                <label for="email" class="form-label fw-semibold small">Email Address *</label>
                <input type="email" class="form-control" id="email" name="email" th:value="${email}" placeholder="john@example.com" required>
            </div>

            <div class="col-md-6">
                <label for="phone" class="form-label fw-semibold small">Phone Number (10-15 digits) *</label>
                <input type="tel" class="form-control" id="phone" name="phone" th:value="${phone}" placeholder="9876543210" required>
            </div>

            <div class="col-md-6">
                <label for="password" class="form-label fw-semibold small">Password (Min 8 chars) *</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Create strong password" minlength="8" required>
            </div>

            <div class="col-md-6">
                <label for="confirmPassword" class="form-label fw-semibold small">Confirm Password *</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" minlength="8" required>
            </div>

            <div class="col-12">
                <label for="address" class="form-label fw-semibold small">Residential Address</label>
                <input type="text" class="form-control" id="address" name="address" th:value="${address}" placeholder="123 Banking St, Financial City">
            </div>

            <div class="col-12">
                <div class="alert alert-info py-2 small mb-0 d-flex align-items-center">
                    <i class="bi bi-info-circle-fill fs-5 me-2 text-primary"></i>
                    <div>
                        <strong>Regulatory Notice:</strong> New accounts are opened with a <strong>₹0.00</strong> starting balance in <code>PENDING_VERIFICATION</code> status. Account operations will be activated upon KYC verification.
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="agreeTerms" name="agreeTerms" value="true" required>
                    <label class="form-check-label small text-muted" for="agreeTerms">
                        I agree to the <span class="text-primary">Terms of Service</span>, Privacy Policy, and Banking Regulations.
                    </label>
                </div>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-check-circle me-1"></i> Register & Open Account
                </button>
            </div>
        </div>
    </form>
</div>

<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        var p1 = document.getElementById('password').value;
        var p2 = document.getElementById('confirmPassword').value;
        if (p1 !== p2) {
            e.preventDefault();
            alert('Passwords do not match. Please re-enter.');
            return false;
        }
    });
</script>

</body>
</html>

# ============================================
# SmartBank Configuration - H2 Profile (Zero Setup)
# Activate with: --spring.profiles.active=h2 or SPRING_PROFILES_ACTIVE=h2
# ============================================

server.port=${PORT:8080}

# H2 Database Configuration (In-memory, clean, zero file locking)
spring.datasource.url=jdbc:h2:mem:smartbank;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Web Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ============================================
# SmartBank Automated Test Suite Configuration
# Runs fast, zero-dependency in-memory tests
# ============================================
spring.application.name=SmartBank-Tests

spring.datasource.url=jdbc:h2:mem:smartbank_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.com.smartbank=INFO
logging.level.org.springframework.security=WARN
